<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <input type="text" placeholder="Please tell me what object you want " id="takeObject" required>

    <h2 id="message"></h2>

    <!--type="module" allows wish.js to import the Three.js library using modern JavaScript syntax.-->
